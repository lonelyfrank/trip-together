name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

  db-schema:
    runs-on: ubuntu-latest
    # Solo se le secret Supabase sono configurate nel repo.
    if: ${{ vars.RUN_DB_CHECK == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run db:check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  ui:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://trip-smoke.supabase.co
      VITE_SUPABASE_ANON_KEY: chiave-simulata-per-test-ui
      UI_BASE_URL: https://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --yes --package=playwright@1.62.1 playwright install --with-deps chromium
      - run: npm run build
      - name: Avvia anteprima
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/trip-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --insecure --fail --silent "$UI_BASE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/trip-preview.log
          exit 1
      - run: npx --yes --package=playwright@1.62.1 -c 'npm run test:ui && npm run test:pwa'
